version: '3.8'
services:
  app:
    build: ./Inventario
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      inven_sec:
        condition: service_healthy

  inven_sec:
    image: mysql:8.0.33
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: inventario
    volumes:
      - ./inventario.sql:/docker-entrypoint-initdb.d/inventario.sql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
