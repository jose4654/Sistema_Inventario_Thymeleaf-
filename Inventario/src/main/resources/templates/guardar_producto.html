<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Guardar Producto</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div th:replace="Fragmentos :: Barra"></div>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${productoDto.id != null ? 'Editar Producto' : 'Formulario para Guardar Producto'}">Formulario para Guardar Producto</h4>
        </div>
        <div class="card-body">

            <!-- Mostrar mensaje de error si existe -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="${productoDto.id != null ? '/productos/actualizar/' + productoDto.id : '/productos/guardar'}" th:object="${productoDto}" method="post">
                <!-- Campo oculto para el ID cuando esté editando -->
                <input type="hidden" th:field="*{id}" th:if="${productoDto.id != null}">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio:</label>
                    <input type="number" id="precio" th:field="*{precio}" class="form-control" step="0.01" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="existencia" class="form-label">Existencia:</label>
                    <input type="number" id="existencia" th:field="*{existencia}" class="form-control" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="categoriaId" class="form-label">Categoría:</label>
                    <select id="categoriaId" th:field="*{categoriaId}" class="form-select" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="1">Bebidas</option>
                        <!-- Podés agregar más opciones dinámicamente -->
                    </select>
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label">URL de la Imagen:</label>
                    <input type="text" id="imagen" th:field="*{imagen}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado:</label>
                    <select id="estado" th:field="*{estado}" class="form-select">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success" th:text="${productoDto.id != null ? 'Actualizar Producto' : 'Guardar Producto'}">Guardar Producto</button>
                    <a th:href="@{/productos/publico}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS (opcional, solo si usás componentes interactivos como modales) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
