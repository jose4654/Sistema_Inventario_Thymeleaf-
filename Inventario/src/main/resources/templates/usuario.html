<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
	<div th:replace="Fragmentos :: Barra"></div>

   
	<div class="container my-5">
	    <div class="row justify-content-center">
	        <div class="col-lg-10">
	            <!-- Card -->
	            <div class="card shadow rounded">
	                <div class="card-header bg-warning text-dark text-center">
	                    <h4 class="mb-0">Listado de Usuarios</h4>
	                </div>
	                <div class="card-body">
	                    <table class="table table-hover table-bordered">
	                        <thead class="table-dark text-center">
	                            <tr>
	                                <th>ID</th>
	                                <th>Nombre</th>
	                                <th>Estado</th>
	                                <th>Roles</th>
	                                <th>Acciones</th>
	                            </tr>
	                        </thead>
	                        <tbody>
	                            <tr th:each="usuario : ${usuarios}">
	                                <td th:text="${usuario.id}">ID</td>
	                                <td th:text="${usuario.userName}">Nombre</td>
	                                <td>
	                                    <span th:text="${usuario.enable ? 'Activo' : 'Inactivo'}"
	                                          th:classappend="${usuario.enable} ? 'badge bg-success' : 'badge bg-danger'">
	                                    </span>
	                                </td>
	                                <td>
	                                    <span class="badge bg-secondary me-1"
	                                          th:each="rol : ${usuario.roles}"
	                                          th:text="${rol.role}"></span>
	                                </td>
	                                <td class="text-center">
	                                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-sm btn-primary">
	                                        <i class="fas fa-edit"></i> Editar
	                                    </a>
	                                </td>
	                            </tr>
	                        </tbody>
	                    </table>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
