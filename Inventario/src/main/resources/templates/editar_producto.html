<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Editar Producto</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
      <div th:replace="Fragmentos :: Barra"></div>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">
                <i class="fas fa-edit"></i> Editar Producto
            </h4>
        </div>
        <div class="card-body">

            <!-- Mostrar mensaje de error si existe -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <form th:action="@{/productos/actualizar/{id}(id=${productoDto.id})}" th:object="${productoDto}" method="post">
                <!-- Campo oculto para el ID -->
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio:</label>
                    <input type="number" id="precio" th:field="*{precio}" class="form-control" step="0.01" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="existencia" class="form-label">Existencia:</label>
                    <input type="number" id="existencia" th:field="*{existencia}" class="form-control" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="categoriaId" class="form-label">Categoría:</label>
                    <select id="categoriaId" th:field="*{categoriaId}" class="form-select" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="1">Bebidas</option>
                        <!-- Podés agregar más opciones dinámicamente -->
                    </select>
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label">URL de la Imagen:</label>
                    <input type="text" id="imagen" th:field="*{imagen}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado:</label>
                    <select id="estado" th:field="*{estado}" class="form-select">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save"></i> Actualizar Producto
                    </button>
                    <a th:href="@{/productos}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Volver a Productos
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
